{% load seo_tags %}
<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
<link rel="canonical" href="{{ seo.canonical }}">
<meta name="robots" content="{{ seo.robots }}">
<meta property="og:locale" content="fa_IR">
<meta property="og:type" content="{{ seo.og.type }}">
<meta property="og:site_name" content="{{ seo.og.site_name }}">
<meta property="og:title" content="{{ seo.og.title }}">
<meta property="og:description" content="{{ seo.og.description }}">
<meta property="og:url" content="{{ seo.canonical }}">
{% if seo.og.image %}<meta property="og:image" content="{{ seo.og.image }}">{% endif %}
<meta name="twitter:card" content="{% if seo.og.image %}summary_large_image{% else %}summary{% endif %}">
<meta name="twitter:title" content="{{ seo.og.title }}">
<meta name="twitter:description" content="{{ seo.og.description }}">
{% if seo.og.image %}<meta name="twitter:image" content="{{ seo.og.image }}">{% endif %}
{% json_ld seo.schema %}
