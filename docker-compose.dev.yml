name: sitaro-dev

services:
  web:
    build: .
    working_dir: /app
    env_file:
      - .env.dev

    volumes:
      - .:/app

    ports:
      - "127.0.0.1:9000:8000"

    command: >
      python manage.py runserver 0.0.0.0:8000

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18

    env_file:
      - .env.dev

    volumes:
      - dev_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev_postgres_data:
