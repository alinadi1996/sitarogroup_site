# Certificates must cover sitarogroup.ir and www.sitarogroup.ir.
server {
    listen 80;
    server_name sitarogroup.ir www.sitarogroup.ir;
    return 301 https://sitarogroup.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name www.sitarogroup.ir;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://sitarogroup.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name sitarogroup.ir;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # Converter permits a 25 MiB file plus multipart overhead.
    client_max_body_size 30m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /static/ {
        alias /srv/static/;
        expires 7d;
    }
    location /media/ {
        alias /srv/media/;
        # Uploaded content is public, non-executable, and download-only.
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /healthz/ {
        access_log off;
        return 404;
    }
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Analyzer can follow redirects and then wait up to 60s for PageSpeed.
        proxy_read_timeout 185s;
    }
}
