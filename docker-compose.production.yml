name: sitaro-production

x-app: &app
  build: .
  image: sitaro-production-web:local
  env_file: .env
  environment:
    DJANGO_ENV: production
    DJANGO_DEBUG: 'false'
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a new production secret in .env}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set production hosts in .env}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set HTTPS origins in .env}
    POSTGRES_DB: ${POSTGRES_DB:?Set database name in .env}
    POSTGRES_USER: ${POSTGRES_USER:?Set database user in .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password in .env}
    POSTGRES_HOST: db
    POSTGRES_PORT: '5432'
    DJANGO_STATIC_ROOT: /code/staticfiles
    DJANGO_MEDIA_ROOT: /code/media
    EMAIL_HOST: ${EMAIL_HOST:?Set SMTP host in .env}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set sender address in .env}
  volumes:
    - static_data:/code/staticfiles
    - media_data:/code/media
  depends_on:
    db:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set database name in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set database user in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    <<: *app
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'python', '/code/deploy/check_health.py']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  release:
    <<: *app
    profiles: ['release']
    command: ['sh', '-c', 'python manage.py migrate --noinput && python manage.py collectstatic --noinput']

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_DIR:?Set absolute certificate directory in .env}:/etc/nginx/tls:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
