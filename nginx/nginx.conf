
server {
    listen 80;
    server_name sitarogroup.com www.sitarogroup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sitarogroup.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sitarogroup.com;

    ssl_certificate /etc/letsencrypt/live/sitarogroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitarogroup.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


