server {
    listen 80;
    server_name sitarogroup.ir www.sitarogroup.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sitarogroup.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sitarogroup.ir www.sitarogroup.ir;

    ssl_certificate /etc/letsencrypt/live/sitarogroup.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitarogroup.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://sitarogroup.com$request_uri;
}


