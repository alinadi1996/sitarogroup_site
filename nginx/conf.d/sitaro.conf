# This directory is the complete /etc/nginx/conf.d mount for the nginx service.
server {
    listen 80;
    server_name sitarogroup.com www.sitarogroup.com sitarogroup.ir www.sitarogroup.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://sitarogroup.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sitarogroup.com;

    ssl_certificate /etc/letsencrypt/live/sitarogroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitarogroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect aliases before they reach Django, which accepts the canonical host.
server {
    listen 443 ssl;
    server_name www.sitarogroup.com;
    ssl_certificate /etc/letsencrypt/live/sitarogroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitarogroup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://sitarogroup.com$request_uri;
}

server {
    listen 443 ssl;
    server_name sitarogroup.ir www.sitarogroup.ir;
    ssl_certificate /etc/letsencrypt/live/sitarogroup.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sitarogroup.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://sitarogroup.com$request_uri;
}
