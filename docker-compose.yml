# Development only. Use docker-compose.production.yml separately for production.
services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    volumes:
      - .:/code
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_ENV: development
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a development secret in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password in .env}
      POSTGRES_HOST: db
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password in .env}
    # Existing data must be backed up/restored before adopting a new named volume.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
